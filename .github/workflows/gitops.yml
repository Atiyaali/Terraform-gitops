name: "Terraform GitOps Pipeline"

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
      - 'terraform.tfvars'
      - 'scripts/**/*.tpl'
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - 'terraform.tfvars'
      - 'scripts/**/*.tpl'

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # Inject AWS credentials and Terraform variables securely from GitHub Secrets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1  # Change to your AWS region
      
      # Automatically maps to variable "github_token" in your Terraform configuration
      TF_VAR_github_token: ${{ secrets.GH_RUNNER_REGISTRATION_TOKEN }}
      
      # Automatically maps to variable "github_repo_url" (or you can put it in terraform.tfvars)
      TF_VAR_github_repo_url: "https://github.com/Atiyaali/wandarlust"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Pull Request)
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply (Merge to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve



      